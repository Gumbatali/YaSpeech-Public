name: Deploy

# Деплой в Yandex Cloud. Запускается:
#   • автоматически — при push в main (после того как тесты прошли);
#   • вручную — кнопкой "Run workflow" с выбором цели (api/worker/frontend/...).
#
# ⚠️  Требует настроенных GitHub Secrets и deployer-сервисного аккаунта.
#     Полная инструкция: docs/project-handbook/05-delivery-and-operations/ci-cd.md

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Что деплоить'
        default: 'all'
        type: choice
        options: [all, api, worker, frontend, gateway]

# Два деплоя одновременно в один прод — плохая идея. Очередь, без отмены текущего.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm test

  deploy:
    name: Деплой в Yandex Cloud
    needs: test            # деплой только если тесты зелёные
    runs-on: ubuntu-latest
    environment: production # позволяет повесить ручной approval в настройках репозитория
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Python + boto3 (нужен для загрузки фронтенда в Object Storage)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet boto3

      - name: Установить Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Авторизовать yc ключом сервисного аккаунта
        env:
          YC_SA_JSON_KEY: ${{ secrets.YC_SA_JSON_KEY }}
          FOLDER_ID: ${{ secrets.FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_JSON_KEY" > "$HOME/yc-key.json"
          "$HOME/yandex-cloud/bin/yc" config set service-account-key "$HOME/yc-key.json"
          "$HOME/yandex-cloud/bin/yc" config set folder-id "$FOLDER_ID"

      - name: Деплой
        # YC не задаём — deploy.sh сам возьмёт $HOME/yandex-cloud/bin/yc,
        # куда установился CLI на предыдущем шаге.
        env:
          SA_ID: ${{ secrets.SA_ID }}
          BUCKET: ${{ secrets.BUCKET }}
          FRONTEND_BUCKET: ${{ secrets.FRONTEND_BUCKET }}
          QUEUE_URL: ${{ secrets.QUEUE_URL }}
          KEY_ID: ${{ secrets.KEY_ID }}
          SECRET: ${{ secrets.SECRET }}
          FOLDER_ID: ${{ secrets.FOLDER_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
        run: bash scripts/deploy.sh "${{ github.event.inputs.target || 'all' }}"

      - name: Убрать ключ
        if: always()
        run: rm -f "$HOME/yc-key.json"
