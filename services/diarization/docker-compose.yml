# Локальный запуск сервисов диаризации.
#
# Каждый сервис на своём порту, чтобы бенчмарк мог опросить их разом:
#   docker compose up pyannote            # один сервис
#   docker compose --profile gpu up       # все GPU-сервисы
#
# Веса моделей лежат в ./models на хосте и монтируются внутрь: так их не нужно
# качать заново при каждой пересборке образа.
#
# GPU-сервисам нужен nvidia-container-toolkit на хосте. pyannote и eend-eda
# работают и без GPU — просто медленнее.

services:
  pyannote:
    build:
      context: .
      dockerfile: pyannote/Dockerfile
    ports: ["8001:8000"]
    volumes: ["./models:/models"]
    environment:
      HF_TOKEN: "${HF_TOKEN:?HF_TOKEN обязателен: веса pyannote под лицензией}"
      MODEL_ID: "${PYANNOTE_MODEL:-pyannote/speaker-diarization-community-1}"
    # Единственный сервис, осмысленно работающий на CPU — GPU не требуем.

  nemo-sortformer:
    build:
      context: .
      dockerfile: nemo-sortformer/Dockerfile
    profiles: ["gpu"]
    ports: ["8002:8000"]
    volumes: ["./models:/models"]
    environment:
      SORTFORMER_THRESHOLD: "${SORTFORMER_THRESHOLD:-0.5}"
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  streaming-sortformer:
    build:
      context: .
      dockerfile: streaming-sortformer/Dockerfile
    profiles: ["gpu"]
    ports: ["8003:8000"]
    volumes: ["./models:/models"]
    environment:
      STREAM_CHUNK_SEC: "${STREAM_CHUNK_SEC:-2.0}"
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  diart:
    build:
      context: .
      dockerfile: diart/Dockerfile
    profiles: ["gpu"]
    ports: ["8004:8000"]
    volumes: ["./models:/models"]
    environment:
      HF_TOKEN: "${HF_TOKEN:?HF_TOKEN обязателен: diart тянет веса pyannote}"
      DIART_TAU_ACTIVE: "${DIART_TAU_ACTIVE:-0.507}"
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  eend-eda:
    build:
      context: .
      dockerfile: eend-eda/Dockerfile
    profiles: ["gpu"]
    ports: ["8005:8000"]
    volumes: ["./models:/models"]
    environment:
      # Чекпоинт надо скачать вручную — см. README, раздел про EEND-EDA.
      EEND_CHECKPOINT: "${EEND_CHECKPOINT:-/models/eend/callhome.pth}"
