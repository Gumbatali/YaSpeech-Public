name: CI

# Прогоняет тесты на каждый push и каждый pull request в main.
# Не деплоит — только проверяет, что код зелёный. Деплоем занимается deploy.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # cache не нужен — у проекта ноль npm-зависимостей (см. README)

      - name: Запустить тесты
        run: npm test
